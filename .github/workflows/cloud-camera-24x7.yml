name: MagicSecurity 24/7 Cloud Bridge (Mac-Off Autonomous Relay)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: magicsecurity-cloud-24x7
  cancel-in-progress: false

jobs:
  cloud-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg and cloudflared
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq ffmpeg curl jq
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Run 24/7 Cloud Camera Bridge & Self-Renew
        env:
          CAMERA_DDNS_HOST: ${{ secrets.CAMERA_DDNS_HOST }}
          CAMERA_PUBLIC_IP: ${{ secrets.CAMERA_PUBLIC_IP }}
          CAMERA_RTSP_PORT: ${{ secrets.CAMERA_RTSP_PORT }}
          CAMERA_ONVIF_PORT: ${{ secrets.CAMERA_ONVIF_PORT }}
          CAMERA_USER: ${{ secrets.CAMERA_USER }}
          CAMERA_PASS: ${{ secrets.CAMERA_PASS }}
          MOBILE_TOKEN: ${{ secrets.MOBILE_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          start_bridge() {
            python3 cloud_bridge.py &
            BRIDGE_PID=$!
          }

          start_tunnel() {
            rm -f /tmp/cf.log
            cloudflared tunnel --no-autoupdate --url http://127.0.0.1:11988 > /tmp/cf.log 2>&1 &
            CF_PID=$!
            CLOUD_URL=""
            for i in $(seq 1 30); do
              CLOUD_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -n 1 || true)
              if [ -n "$CLOUD_URL" ]; then break; fi
              sleep 1
            done
            echo "Cloud Tunnel active: $CLOUD_URL"
          }

          start_bridge
          sleep 2
          start_tunnel

          publish_state() {
            [ -z "$CLOUD_URL" ] && return
            for attempt in 1 2; do
              git fetch origin main || true
              git reset --hard origin/main || true
              MAC_TUN=$(jq -r '.macTunnel // ""' tunnel.json 2>/dev/null || echo "")
              PUB_IP=$(jq -r '.publicIP // ""' tunnel.json 2>/dev/null || echo "")
              if [ -z "$PUB_IP" ]; then PUB_IP="$CAMERA_PUBLIC_IP"; fi
              TS=$(date +%s)
              jq -n \
                --arg tun "${MAC_TUN:-$CLOUD_URL}" \
                --arg mac "$MAC_TUN" \
                --arg cloud "$CLOUD_URL" \
                --arg pub "$PUB_IP" \
                --arg ch "$CHANNEL_ID" \
                --arg tok "$MOBILE_TOKEN" \
                --argjson ts "$TS" \
                '{tunnel: (if $mac != "" then $mac else $cloud end), macTunnel: $mac, cloudTunnel: $cloud, publicIP: $pub, cameraName: "Tapo C520WS", channel: $ch, token: $tok, ts: $ts}' > tunnel.json

              git config user.name "MagicSecurity Cloud 24/7"
              git config user.email "cloud@magicsecurity.local"
              git add tunnel.json
              if git diff --cached --quiet; then
                break
              fi
              if git commit -m "chore: update 24/7 cloud tunnel endpoint" && git push origin main; then
                break
              fi
              sleep 2
            done

            if [ -n "$CHANNEL_ID" ]; then
              curl -s -X POST "https://ntfy.sh/$CHANNEL_ID" \
                -H "Content-Type: application/json" \
                -d "{\"tunnel\":\"$CLOUD_URL\",\"cloudTunnel\":\"$CLOUD_URL\",\"macTunnel\":\"$MAC_TUN\",\"cameraName\":\"Tapo C520WS\",\"ts\":$TS}" >/dev/null || true
            fi
          }

          publish_state

          # Mantener vivo ~5 horas con auto-curación cada 60 s y relevo sin corte al final
          START_TS=$(date +%s)
          LAST_PUB_TS=$START_TS
          PING_FAILS=0
          HANDOFF_TRIGGERED=0

          while true; do
            NOW_TS=$(date +%s)
            ELAPSED=$((NOW_TS - START_TS))

            # Auto-curar puente Python si muere
            if ! kill -0 "$BRIDGE_PID" 2>/dev/null; then
              echo "Reiniciando cloud_bridge.py..."
              start_bridge
              sleep 2
            fi

            # Auto-curar túnel cloudflared si muere o falla 3 pings seguidos
            TUNNEL_OK=0
            if kill -0 "$CF_PID" 2>/dev/null && [ -n "$CLOUD_URL" ]; then
              if curl -fsS --max-time 6 "$CLOUD_URL/api/ping" >/dev/null 2>&1; then
                TUNNEL_OK=1
                PING_FAILS=0
              else
                PING_FAILS=$((PING_FAILS + 1))
              fi
            else
              PING_FAILS=3
            fi

            if [ "$PING_FAILS" -ge 3 ]; then
              echo "Túnel caído ($PING_FAILS fallos); renovando cloudflared al instante..."
              kill "$CF_PID" 2>/dev/null || true
              sleep 1
              start_tunnel
              PING_FAILS=0
              publish_state
              LAST_PUB_TS=$NOW_TS
            elif [ $((NOW_TS - LAST_PUB_TS)) -ge 600 ]; then
              publish_state
              LAST_PUB_TS=$NOW_TS
            fi

            # Relevo con solapamiento (zero-downtime): dispara siguiente instancia a las 4h55m y mantiene viva esta 50 s más
            if [ "$ELAPSED" -ge 17700 ] && [ "$HANDOFF_TRIGGERED" -eq 0 ]; then
              echo "Lanzando siguiente turno Cloud 24/7 con solapamiento sin cortes..."
              gh workflow run cloud-camera-24x7.yml --repo "${{ github.repository }}" || true
              HANDOFF_TRIGGERED=1
            fi
            if [ "$ELAPSED" -ge 17755 ]; then
              echo "Turno completado limpiamente."
              break
            fi

            sleep 60
          done
