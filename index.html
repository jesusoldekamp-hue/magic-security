<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MagicSecurity">
<meta name="theme-color" content="#0b0e13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%230b0e13'/%3E%3Ccircle cx='60' cy='60' r='34' fill='%2306b6d4' opacity='0.22'/%3E%3Ccircle cx='60' cy='60' r='16' fill='%2322d3ee'/%3E%3C/svg%3E">
<title>MagicSecurity · Cámara en Vivo 24/7</title>
<style>
  :root {
    color-scheme: dark;
    accent-color: #22d3ee;
    --bg-canvas: #0b0e13;
    --bg-surface: #131820;
    --bg-control: #1b222e;
    --bg-control-hover: #232c3b;
    --border-subtle: rgba(255, 255, 255, 0.12);
    --border-strong: rgba(255, 255, 255, 0.24);
    --text-primary: #f1f5f9;
    --text-secondary: #cbd5e1;
    --accent: #22d3ee;
    --accent-bg: rgba(34, 211, 238, 0.16);
    --accent-border: rgba(34, 211, 238, 0.55);
    --danger: #f87171;
    --danger-bg: rgba(239, 68, 68, 0.22);
    --danger-border: rgba(248, 113, 113, 0.55);
    --success: #4ade80;
    --warn: #fbbf24;
    scrollbar-color: #334155 #0b0e13;
  }

  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  ::selection { background: rgba(34, 211, 238, 0.28); color: var(--text-primary); }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg-canvas); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    line-height: 1.45; overflow-wrap: anywhere; min-height: 100dvh;
  }

  body {
    display: flex; flex-direction: column; align-items: center;
    padding: max(12px, env(safe-area-inset-top, 12px)) max(12px, env(safe-area-inset-right, 12px)) max(24px, env(safe-area-inset-bottom, 24px)) max(12px, env(safe-area-inset-left, 12px));
  }

  .app { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 14px; }

  .topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 2px 0; }
  .identity { display: flex; align-items: center; gap: 10px; min-inline-size: 0; }

  .live-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); flex-shrink: 0; transition: background-color 180ms ease; }
  .live-dot.is-live { background: var(--success); box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.18); }

  h1 { margin: 0; font-size: 1.0625rem; font-weight: 700; letter-spacing: -0.01em; color: var(--text-primary); text-wrap: balance; }

  .meta-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .telemetry-pill {
    font-size: 0.75rem; font-weight: 600; font-variant-numeric: tabular-nums;
    color: var(--text-secondary); background: var(--bg-surface);
    border: 1px solid var(--border-subtle); border-radius: 999px; padding: 5px 10px;
  }

  .segmented { display: inline-flex; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg-btn {
    min-height: 36px; min-width: 54px; padding: 0 10px; border: 0; border-radius: 7px;
    background: transparent; color: var(--text-secondary); font-size: 0.75rem; font-weight: 700; cursor: pointer;
    transition: background-color 150ms ease-out, color 150ms ease-out;
  }
  .seg-btn[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-border); }

  .stage {
    position: relative; width: 100%; aspect-ratio: 16 / 9; background: #05070b;
    border-radius: 16px; overflow: hidden; border: 1px solid var(--border-subtle);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
  }
  .stage.is-expanded { position: fixed; inset: 0; z-index: 50; aspect-ratio: auto; width: 100vw; height: 100dvh; border-radius: 0; border: 0; }
  .stage img { width: 100%; height: 100%; object-fit: contain; display: block; user-select: none; transition: transform 200ms ease-out; }
  .stage.zoomed img { transform: scale(2); }

  .stage-hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
    font-size: 0.6875rem; font-weight: 800; letter-spacing: 0.04em;
    background: rgba(11, 14, 19, 0.78); border: 1px solid var(--border-subtle); color: var(--text-primary); backdrop-filter: blur(8px);
  }
  .badge.is-alert { background: rgba(127, 29, 29, 0.88); border-color: var(--danger-border); color: #fee2e2; }

  .toast-hud {
    position: absolute; bottom: 12px; left: 12px; background: rgba(11, 14, 19, 0.86);
    border: 1px solid var(--border-subtle); color: var(--text-primary); font-size: 0.75rem; font-weight: 600;
    padding: 6px 12px; border-radius: 999px; opacity: 0; transform: translateY(4px);
    transition: opacity 150ms ease, transform 150ms ease; pointer-events: none;
  }
  .toast-hud.visible { opacity: 1; transform: translateY(0); }

  .video-tools { position: absolute; bottom: 10px; right: 10px; display: flex; gap: 6px; }
  .tool-btn {
    width: 44px; height: 44px; border-radius: 11px; border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(11, 14, 19, 0.76); color: var(--text-primary); display: grid; place-items: center;
    cursor: pointer; backdrop-filter: blur(8px); transition: background-color 150ms ease-out, transform 120ms ease-out;
  }
  .tool-btn:hover { background: rgba(27, 34, 46, 0.92); }
  .tool-btn:active { transform: scale(0.95); }
  .tool-btn[aria-pressed="true"] { background: rgba(8, 51, 68, 0.92); border-color: var(--accent); color: var(--accent); }

  .panel {
    background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 18px;
    padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
  }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  h2 { margin: 0; font-size: 0.9375rem; font-weight: 700; color: var(--text-primary); text-wrap: balance; }
  .panel-status { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); }

  .ptz-stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .dpad-ring {
    position: relative; width: 240px; height: 240px; border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #1d2636 0%, #10151e 72%);
    border: 1.5px solid var(--border-strong);
    box-shadow: inset 0 2px 12px rgba(255, 255, 255, 0.04), 0 10px 26px rgba(0, 0, 0, 0.45);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .dpad-ring.is-moving { border-color: var(--accent-border); box-shadow: inset 0 2px 14px rgba(34, 211, 238, 0.14), 0 10px 28px rgba(0, 0, 0, 0.5); }
  .dpad-crosshair { position: absolute; inset: 22px; border-radius: 50%; border: 1px dashed rgba(255, 255, 255, 0.08); pointer-events: none; }

  .ptz-btn {
    position: absolute; width: 46px; height: 46px; margin-left: -23px; margin-top: -23px;
    border-radius: 14px; border: 1px solid var(--border-subtle); background: var(--bg-control);
    color: var(--text-primary); display: grid; place-items: center; cursor: pointer;
    touch-action: none; user-select: none; -webkit-user-select: none;
    transition: background-color 140ms ease-out, border-color 140ms ease-out, transform 120ms ease-out, color 140ms ease-out;
  }
  .ptz-btn:hover { background: var(--bg-control-hover); border-color: var(--border-strong); }
  .ptz-btn.pressing, .ptz-btn:active { transform: scale(0.93); background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .ptz-diag { width: 44px; height: 44px; margin-left: -22px; margin-top: -22px; border-radius: 50%; background: rgba(27, 34, 46, 0.72); }

  .ptz-stop {
    position: absolute; left: 120px; top: 120px; width: 52px; height: 52px; margin-left: -26px; margin-top: -26px;
    border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.22); background: #222b3a; color: var(--text-primary);
    font-size: 0.6875rem; font-weight: 800; letter-spacing: 0.03em;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    cursor: pointer; touch-action: manipulation;
  }
  .ptz-stop:active { transform: scale(0.94); background: var(--danger-bg); border-color: var(--danger-border); color: #fecaca; }

  .pos-up        { left: 120px; top: 32px; }
  .pos-down      { left: 120px; top: 208px; }
  .pos-left      { left: 32px;  top: 120px; }
  .pos-right     { left: 208px; top: 120px; }
  .pos-upleft    { left: 58px;  top: 58px; }
  .pos-upright   { left: 182px; top: 58px; }
  .pos-downleft  { left: 58px;  top: 182px; }
  .pos-downright { left: 182px; top: 182px; }

  .ptz-subcontrols { width: 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
  .btn-chip {
    flex: 1 1 130px; min-height: 44px; padding: 0 12px; border-radius: 12px;
    border: 1px solid var(--border-subtle); background: var(--bg-control); color: var(--text-secondary);
    font-size: 0.8125rem; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    cursor: pointer; touch-action: manipulation;
  }
  .btn-chip[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent); }

  .presets-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
  .btn-preset {
    min-height: 44px; border-radius: 12px; border: 1px solid var(--border-subtle);
    background: var(--bg-control); color: var(--text-primary); font-size: 0.8125rem; font-weight: 700; cursor: pointer;
  }
  .btn-preset:active { transform: scale(0.96); background: var(--accent-bg); border-color: var(--accent-border); }

  .siren-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .btn-action {
    min-height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--border-subtle);
    background: var(--bg-control); color: var(--text-primary); font-size: 0.875rem; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  }
  .btn-danger { background: var(--danger-bg); border-color: var(--danger-border); color: #fecaca; }

  :where(button):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { margin: 0; font-size: 0.75rem; color: var(--text-secondary); text-align: center; text-wrap: pretty; }
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="identity">
      <span class="live-dot" id="liveDot" aria-hidden="true"></span>
      <h1 id="camTitle">Tapo C520WS</h1>
    </div>
    <div class="meta-row">
      <span class="telemetry-pill" id="telemetryPill">Conectando…</span>
      <div class="segmented" role="group" aria-label="Calidad de video móvil">
        <button type="button" class="seg-btn" id="qSdBtn" aria-pressed="true">Fluido</button>
        <button type="button" class="seg-btn" id="qHdBtn" aria-pressed="false">HD</button>
      </div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Monitor de video en vivo">
    <img id="cam" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 90'%3E%3Crect width='160' height='90' fill='%2305070b'/%3E%3Ccircle cx='80' cy='45' r='16' fill='none' stroke='%2322d3ee' stroke-opacity='0.35' stroke-width='2'/%3E%3Ccircle cx='80' cy='45' r='4' fill='%2322d3ee' fill-opacity='0.6'/%3E%3C/svg%3E" alt="Transmisión en vivo">
    <div class="stage-hud">
      <span class="badge" id="stateBadge">CONECTANDO…</span>
      <span class="badge is-alert" id="sirenBadge" hidden>ALARMA ACTIVA</span>
    </div>
    <div class="toast-hud" id="toastHud" role="status" aria-live="polite"></div>
    <div class="video-tools">
      <button type="button" class="tool-btn" id="zoomBtn" aria-pressed="false" aria-label="Zoom 2x">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>
      <button type="button" class="tool-btn" id="snapBtn" aria-label="Guardar foto actual">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <button type="button" class="tool-btn" id="fsBtn" aria-pressed="false" aria-label="Pantalla completa">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </button>
    </div>
  </section>

  <section class="panel" aria-label="Control remoto de cámara">
    <div class="panel-head">
      <h2>Control Remoto</h2>
      <span class="panel-status" id="ptzStateLabel">Toca o mantén presionado</span>
    </div>

    <div class="ptz-stage">
      <div class="dpad-ring" id="dpadRing" tabindex="0" role="group" aria-label="Cruceta direccional de 8 ejes">
        <div class="dpad-crosshair" aria-hidden="true"></div>
        <button type="button" class="ptz-btn pos-up" data-dir="up" aria-label="Mover hacia arriba"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg></button>
        <button type="button" class="ptz-btn pos-down" data-dir="down" aria-label="Mover hacia abajo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
        <button type="button" class="ptz-btn pos-left" data-dir="left" aria-label="Mover a la izquierda"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
        <button type="button" class="ptz-btn pos-right" data-dir="right" aria-label="Mover a la derecha"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
        <button type="button" class="ptz-btn ptz-diag pos-upleft" data-dir="upleft" aria-label="Diagonal arriba izquierda"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="17" y1="17" x2="7" y2="7"/><polyline points="7 16 7 7 16 7"/></svg></button>
        <button type="button" class="ptz-btn ptz-diag pos-upright" data-dir="upright" aria-label="Diagonal arriba derecha"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="8 7 17 7 17 16"/></svg></button>
        <button type="button" class="ptz-btn ptz-diag pos-downleft" data-dir="downleft" aria-label="Diagonal abajo izquierda"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="17" y1="7" x2="7" y2="17"/><polyline points="16 17 7 17 7 8"/></svg></button>
        <button type="button" class="ptz-btn ptz-diag pos-downright" data-dir="downright" aria-label="Diagonal abajo derecha"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="7" x2="17" y2="17"/><polyline points="17 8 17 17 8 17"/></svg></button>
        <button type="button" class="ptz-stop" id="stopMoveBtn" aria-label="Detener movimiento"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg><span>STOP</span></button>
      </div>

      <div class="ptz-subcontrols">
        <span class="panel-status">Velocidad de giro</span>
        <div class="segmented" role="group" aria-label="Velocidad de giro">
          <button type="button" class="seg-btn speed-btn" data-speed="0.7" aria-pressed="false">Suave</button>
          <button type="button" class="seg-btn speed-btn" data-speed="1.0" aria-pressed="true">Normal</button>
          <button type="button" class="seg-btn speed-btn" data-speed="1.5" aria-pressed="false">Rápido</button>
        </div>
      </div>

      <div class="chip-row">
        <button type="button" class="btn-chip" id="invertTiltBtn" aria-pressed="false">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><polyline points="8 9 12 5 16 9"/><polyline points="8 15 12 19 16 15"/></svg>
          <span>Invertir Arriba/Abajo</span>
        </button>
        <button type="button" class="btn-chip" id="invertPanBtn" aria-pressed="false">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><polyline points="9 8 5 12 9 16"/><polyline points="15 8 19 12 15 16"/></svg>
          <span>Invertir Izq/Der</span>
        </button>
      </div>

      <div class="presets-row">
        <button type="button" class="btn-preset" data-preset="p1">Posición 1</button>
        <button type="button" class="btn-preset" data-preset="p2">Posición 2</button>
        <button type="button" class="btn-preset" data-preset="p3">Posición 3</button>
      </div>
    </div>
  </section>

  <section class="panel" aria-label="Alarma y disuasión">
    <div class="panel-head">
      <h2>Alarma y Disuasión</h2>
      <span class="panel-status">Altavoz de la cámara</span>
    </div>
    <div class="siren-grid">
      <button type="button" class="btn-action btn-danger" data-siren="police"><span>Sirena (7s)</span></button>
      <button type="button" class="btn-action" data-siren="stop"><span>Detener Audio</span></button>
      <button type="button" class="btn-action" data-siren="voice"><span>Voz Aviso</span></button>
      <button type="button" class="btn-action" data-siren="beep"><span>Pitido Alerta</span></button>
    </div>
  </section>

  <p class="hint">📌 Link Fijo 24/7: funciona desde cualquier celular o país (con respaldo Cloud 24/7 aunque la Mac esté apagada).</p>
</main>

<script>
(() => {
  const DEFAULT_C = "ms_3xHUmUxzQPvhhCky9Q";
  const DEFAULT_T = "45BwGjboYxfraNWL";
  const params = new URLSearchParams(window.location.search);
  const cleanParam = (v) => (v || "").replace(/\*+$/g, "").trim();
  let C = cleanParam(params.get("c")) || localStorage.getItem("ms_channel") || DEFAULT_C;
  let T = cleanParam(params.get("t")) || localStorage.getItem("ms_token") || DEFAULT_T;
  localStorage.setItem("ms_channel", C);
  localStorage.setItem("ms_token", T);

  let BASE = localStorage.getItem("ms_base_" + C) || "";
  let candidateBases = [];
  let consecutiveErrors = 0;
  let isResolving = false;

  const stage = document.getElementById("stage");
  const cam = document.getElementById("cam");
  const camTitle = document.getElementById("camTitle");
  const liveDot = document.getElementById("liveDot");
  const stateBadge = document.getElementById("stateBadge");
  const sirenBadge = document.getElementById("sirenBadge");
  const telemetryPill = document.getElementById("telemetryPill");
  const toastHud = document.getElementById("toastHud");
  const ptzStateLabel = document.getElementById("ptzStateLabel");
  const dpadRing = document.getElementById("dpadRing");
  const qSdBtn = document.getElementById("qSdBtn");
  const qHdBtn = document.getElementById("qHdBtn");
  const zoomBtn = document.getElementById("zoomBtn");
  const snapBtn = document.getElementById("snapBtn");
  const fsBtn = document.getElementById("fsBtn");
  const invertTiltBtn = document.getElementById("invertTiltBtn");
  const invertPanBtn = document.getElementById("invertPanBtn");

  let quality = "sd";
  let speed = 1.0;
  let frameLoopTimer = null;
  let inFlightAbort = null;
  let currentBlobURL = null;
  let lastLatencyMs = 0;
  let serverFPS = 0;
  let toastTimer = null;

  function toast(msg, ms = 1400) {
    toastHud.textContent = msg;
    toastHud.classList.add("visible");
    clearTimeout(toastTimer);
    if (ms > 0) toastTimer = setTimeout(() => toastHud.classList.remove("visible"), ms);
  }

  function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

  function renderTelemetry() {
    const fpsPart = serverFPS > 0 ? `${serverFPS} fps` : "EN VIVO";
    const latPart = lastLatencyMs > 0 ? `${lastLatencyMs} ms` : "24/7";
    telemetryPill.textContent = `${fpsPart} · ${latPart}`;
  }

  function addCandidate(url) {
    if (!url || typeof url !== "string" || !url.startsWith("https://")) return;
    const clean = url.replace(/\/$/, "");
    if (!candidateBases.includes(clean)) candidateBases.unshift(clean);
  }

  async function probeBase(url) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 3500);
      const res = await fetch(`${url}/api/ping`, { cache: "no-store", signal: ctrl.signal });
      clearTimeout(timer);
      return res.ok;
    } catch (_) {
      return false;
    }
  }

  async function resolveLatestTunnel() {
    if (isResolving) return BASE;
    isResolving = true;
    try {
      // 1. Consultar tunnel.json en el mismo dominio github.io (nunca bloqueado ni expira en 50+ días)
      try {
        const res = await fetch(`./tunnel.json?ts=${Date.now()}`, { cache: "no-store" });
        if (res.ok) {
          const info = await res.json();
          if (info.cameraName) camTitle.textContent = info.cameraName;
          if (info.token && !params.get("t")) T = info.token;
          if (info.channel && !params.get("c")) C = info.channel;
          addCandidate(info.cloudTunnel);
          addCandidate(info.macTunnel);
          addCandidate(info.tunnel);
        }
      } catch (_) {}

      // 2. Consultar canal ntfy en tiempo real
      if (C) {
        try {
          const res = await fetch(`https://ntfy.sh/${encodeURIComponent(C)}/json?poll=1&since=all`, { cache: "no-store" });
          if (res.ok) {
            const text = await res.text();
            const lines = text.trim().split("\n").filter(Boolean);
            for (let i = lines.length - 1; i >= 0; i--) {
              try {
                const evt = JSON.parse(lines[i]);
                if (evt && evt.message) {
                  const payload = JSON.parse(evt.message);
                  if (payload.cameraName) camTitle.textContent = payload.cameraName;
                  addCandidate(payload.cloudTunnel);
                  addCandidate(payload.tunnel);
                }
              } catch (_) {}
            }
          }
        } catch (_) {}
      }

      // 3. Probar candidatos y elegir el primero que responda /api/ping
      for (const cand of candidateBases) {
        if (await probeBase(cand)) {
          BASE = cand;
          localStorage.setItem("ms_base_" + C, BASE);
          isResolving = false;
          return BASE;
        }
      }
      if (!BASE && candidateBases.length > 0) {
        BASE = candidateBases[0];
      }
    } catch (_) {}
    isResolving = false;
    return BASE;
  }

  async function pullNextFrame() {
    if (document.visibilityState === "hidden") return;
    if (!BASE) {
      await resolveLatestTunnel();
      if (!BASE) {
        stateBadge.textContent = "CONECTANDO CON CÁMARA 24/7…";
        clearTimeout(frameLoopTimer);
        frameLoopTimer = setTimeout(pullNextFrame, 2000);
        return;
      }
    }
    if (inFlightAbort) inFlightAbort.abort();
    const ctrl = new AbortController();
    inFlightAbort = ctrl;
    const t0 = performance.now();
    try {
      const res = await fetch(`${BASE}/frame.jpg?t=${encodeURIComponent(T)}&q=${quality}&ts=${Date.now()}`, {
        cache: "no-store",
        signal: ctrl.signal
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const blob = await res.blob();
      const nextURL = URL.createObjectURL(blob);
      const prevURL = currentBlobURL;
      currentBlobURL = nextURL;
      cam.onload = () => { if (prevURL) URL.revokeObjectURL(prevURL); };
      cam.src = nextURL;

      consecutiveErrors = 0;
      lastLatencyMs = Math.round(performance.now() - t0);
      liveDot.classList.add("is-live");
      stateBadge.textContent = "EN VIVO · 24/7";
      renderTelemetry();
      clearTimeout(frameLoopTimer);
      frameLoopTimer = setTimeout(pullNextFrame, 75);
    } catch (err) {
      if (err.name === "AbortError") return;
      consecutiveErrors++;
      liveDot.classList.remove("is-live");
      stateBadge.textContent = "RECONECTANDO…";
      if (consecutiveErrors >= 2) {
        await resolveLatestTunnel();
      }
      clearTimeout(frameLoopTimer);
      frameLoopTimer = setTimeout(pullNextFrame, 850);
    }
  }

  async function pollStatus() {
    if (document.visibilityState === "hidden" || !BASE) return;
    try {
      const res = await fetch(`${BASE}/api/status?t=${encodeURIComponent(T)}`, { cache: "no-store" });
      if (!res.ok) return;
      const data = await res.json();
      if (data.cameraName) camTitle.textContent = data.cameraName;
      serverFPS = Number(data.fps || 0);
      sirenBadge.hidden = !Boolean(data.isSirenActive);
      dpadRing.classList.toggle("is-moving", Boolean(data.isMoving));
      invertTiltBtn.setAttribute("aria-pressed", String(Boolean(data.invertTilt)));
      invertPanBtn.setAttribute("aria-pressed", String(Boolean(data.invertPan)));
      if (data.ptzStatus) ptzStateLabel.textContent = data.ptzStatus;
      renderTelemetry();
    } catch (_) {}
  }

  async function sendPTZ(paramsObj) {
    if (!BASE) await resolveLatestTunnel();
    if (!BASE) { toast("Conectando…", 1400); return { ok: false }; }
    const qs = new URLSearchParams({ t: T, ...paramsObj });
    try {
      const res = await fetch(`${BASE}/api/ptz?${qs.toString()}`, { method: "POST" });
      const data = await res.json();
      if (typeof data.invertTilt === "boolean") invertTiltBtn.setAttribute("aria-pressed", String(data.invertTilt));
      if (typeof data.invertPan === "boolean") invertPanBtn.setAttribute("aria-pressed", String(data.invertPan));
      return data;
    } catch (_) {
      resolveLatestTunnel();
      toast("Reconectando…", 1500);
      return { ok: false };
    }
  }

  document.querySelectorAll(".ptz-btn").forEach((btn) => {
    const dir = btn.dataset.dir;
    let holdTimer = null;
    let isHold = false;
    let activePointer = null;

    const startPress = (e) => {
      if (activePointer !== null) return;
      e.preventDefault();
      activePointer = e.pointerId;
      try { btn.setPointerCapture(e.pointerId); } catch (_) {}
      isHold = false;
      btn.classList.add("pressing");
      dpadRing.classList.add("is-moving");
      vibrate(12);
      holdTimer = setTimeout(() => {
        isHold = true;
        ptzStateLabel.textContent = "Girando continuo…";
        sendPTZ({ action: "start", dir, speed });
      }, 170);
    };

    const endPress = (e) => {
      if (activePointer === null) return;
      if (e && e.pointerId !== undefined && e.pointerId !== activePointer) return;
      activePointer = null;
      clearTimeout(holdTimer);
      holdTimer = null;
      btn.classList.remove("pressing");
      if (isHold) {
        isHold = false;
        vibrate(6);
        ptzStateLabel.textContent = "Deteniendo…";
        sendPTZ({ action: "stop" }).then(() => {
          dpadRing.classList.remove("is-moving");
          ptzStateLabel.textContent = "Toca o mantén presionado";
        });
      } else {
        ptzStateLabel.textContent = "Moviendo paso…";
        sendPTZ({ action: "nudge", dir, speed }).then((r) => {
          dpadRing.classList.remove("is-moving");
          ptzStateLabel.textContent = r.ok ? "Toca o mantén presionado" : "Reintentando PTZ…";
        });
      }
    };

    btn.addEventListener("pointerdown", startPress);
    btn.addEventListener("pointerup", endPress);
    btn.addEventListener("pointercancel", endPress);
    btn.addEventListener("lostpointercapture", endPress);
    btn.addEventListener("contextmenu", (e) => e.preventDefault());
  });

  document.getElementById("stopMoveBtn").addEventListener("click", () => {
    vibrate(15);
    dpadRing.classList.remove("is-moving");
    sendPTZ({ action: "stop" });
  });

  document.querySelectorAll(".speed-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      speed = Number(btn.dataset.speed || 1.0);
      document.querySelectorAll(".speed-btn").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
      toast(`Velocidad: ${btn.textContent}`, 900);
    });
  });

  invertTiltBtn.addEventListener("click", () => {
    sendPTZ({ action: "invert_tilt" }).then((r) => toast(r.invertTilt ? "Arriba/Abajo invertido" : "Arriba/Abajo normal", 1200));
  });

  invertPanBtn.addEventListener("click", () => {
    sendPTZ({ action: "invert_pan" }).then((r) => toast(r.invertPan ? "Izq/Der invertido" : "Izq/Der normal", 1200));
  });

  document.querySelectorAll(".btn-preset").forEach((btn) => {
    btn.addEventListener("click", () => {
      vibrate(10);
      sendPTZ({ action: "preset", dir: btn.dataset.preset });
    });
  });

  document.querySelectorAll("[data-siren]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      vibrate(14);
      if (!BASE) await resolveLatestTunnel();
      if (!BASE) return;
      const mode = btn.dataset.siren;
      try {
        const res = await fetch(`${BASE}/api/siren?t=${encodeURIComponent(T)}&mode=${encodeURIComponent(mode)}`, { method: "POST" });
        const data = await res.json();
        sirenBadge.hidden = !Boolean(data.isSirenActive);
        toast(mode === "stop" ? "Audio detenido" : "Alarma enviada a cámara", 1500);
      } catch (_) {}
    });
  });

  function setQuality(q) {
    quality = q;
    qSdBtn.setAttribute("aria-pressed", String(q === "sd"));
    qHdBtn.setAttribute("aria-pressed", String(q === "hd"));
    pullNextFrame();
  }
  qSdBtn.addEventListener("click", () => setQuality("sd"));
  qHdBtn.addEventListener("click", () => setQuality("hd"));

  zoomBtn.addEventListener("click", () => {
    const next = !stage.classList.contains("zoomed");
    stage.classList.toggle("zoomed", next);
    zoomBtn.setAttribute("aria-pressed", String(next));
  });

  snapBtn.addEventListener("click", () => {
    if (!currentBlobURL) return;
    const a = document.createElement("a");
    a.href = currentBlobURL;
    a.download = `MagicSecurity-${new Date().toISOString().replace(/[:.]/g, "-")}.jpg`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast("Foto guardada", 1200);
  });

  fsBtn.addEventListener("click", async () => {
    const isExpanded = stage.classList.contains("is-expanded");
    if (!isExpanded && stage.requestFullscreen && document.fullscreenEnabled) {
      try { await stage.requestFullscreen(); fsBtn.setAttribute("aria-pressed", "true"); return; } catch (_) {}
    } else if (document.fullscreenElement) {
      try { await document.exitFullscreen(); fsBtn.setAttribute("aria-pressed", "false"); return; } catch (_) {}
    }
    stage.classList.toggle("is-expanded", !isExpanded);
    fsBtn.setAttribute("aria-pressed", String(!isExpanded));
  });

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      resolveLatestTunnel().then(() => { pullNextFrame(); pollStatus(); });
    }
  });

  resolveLatestTunnel().then(() => {
    pullNextFrame();
    pollStatus();
  });
  setInterval(pollStatus, 3500);
  setInterval(resolveLatestTunnel, 20000);
})();
</script>
</body>
</html>
